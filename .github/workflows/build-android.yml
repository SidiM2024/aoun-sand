name: Build Android App

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Vite Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Release Keystore
        id: generate-keystore
        run: |
          keytool -genkey -v \
            -keystore my-release-key.keystore \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Aoun Sand, OU=IT, O=Aoun Sand, L=City, S=State, C=PS" \
            -storepass "aounsand2024" \
            -keypass "aounsand2024"
          # Move keystore to android/app directory so gradle can find it
          mv my-release-key.keystore android/app/

      - name: Build Signed AAB
        working-directory: ./android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=my-release-key.keystore \
            -Pandroid.injected.signing.store.password=aounsand2024 \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=aounsand2024

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoun-sand-app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload Keystore (KEEP THIS SAFE)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: android/app/my-release-key.keystore
          retention-days: 7
